<!-- VERSÃO SEM REACTIVEFORMS -->
<div *ngIf="!form" class="token_input">
  <div [attr.data-test]="testId" class="token_input__wrapper">
    <input
      *ngFor="let token of [].constructor(qtdInputs); let i = index"
      class="token_input__field {{ class }} {{ state }}"
      #tokenInputField
      maxlength="1"
      size="1"
      [id]="id"
      [type]="type"
      [readOnly]="readOnly"
      [name]="name"
      [attr.aria-label]="ariaLabel"
      [attr.aria-required]="ariaRequired"
      [attr.aria-invalid]="ariaInvalid"
      [disabled]="disabled"
      (input)="inputToken($event, i)"
      (keydown)="keyDownToken($event, i)"
      (paste)="pasteToken($event)"
    />
  </div>
</div>
<!-- VERSÃO COM REACTIVEFORMS -->
<div *ngIf="!!form" class="token_input">
  <div
    [attr.data-test]="testId"
    [formGroup]="form"
    class="token_input__wrapper"
  >
    <input
      *ngFor="let token of [].constructor(qtdInputs); let i = index"
      class="token_input__field {{ class }} {{ state }}"
      #tokenInputField
      maxlength="1"
      size="1"
      [id]="id"
      [type]="type"
      [readOnly]="readOnly"
      [name]="name"
      [attr.disabled]="disabled"
      [attr.aria-label]="ariaLabel"
      [attr.aria-required]="ariaRequired"
      [attr.aria-invalid]="ariaInvalid"
      [formControlName]="name"
      (input)="inputToken($event, i)"
      (keydown)="keyDownToken($event, i)"
      (paste)="pasteToken($event)"
    />
  </div>
</div>
