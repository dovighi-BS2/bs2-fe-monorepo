<button
  [type]="type"
  [attr.id]="id"
  [attr.data-test]="testId || id"
  [attr.tabindex]="tabindex"
  [disabled]="disabled"
  [attr.aria-disabled]="disabled"
  [attr.aria-label]="ariaLabel"
  class="button primary {{ class }} {{ design }}"
>
  <span class="button__icon left" select="leftIcon"></span>
  <ng-content></ng-content>
  <span class="button__icon right" select="rightIcon"></span>
</button>
