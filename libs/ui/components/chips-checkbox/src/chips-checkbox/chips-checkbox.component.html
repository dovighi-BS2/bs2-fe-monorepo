<ul class="chip">
  @for(item of _options; track item.label) {
  <li
    tabindex="1"
    class="
      chip__item
      {{ item.disabled ? 'disabled' : '' }}
      {{ isSelected(item) ? 'selected' : '' }}
    "
    (click)="select(item)"
    (keyup.enter)="select(item)"
    (keyup.space)="select(item)"
  >
    {{ item.label }}
  </li>
  }
</ul>
