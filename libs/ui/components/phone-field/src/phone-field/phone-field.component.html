<div class="phone_field" *ngIf="!!form">
  <currency-field
    class="select_flag"
    [readOnly]="readOnly"
    [helperText]="helperText"
    [errorText]="errorText"
    [form]="inputForm"
    [options]="options"
    [id]="id"
    [testId]="testId"
    [label]="label"
    name="ddi"
    [hideCheckbox]="hideCheckbox"
    [state]="state"
    [multiple]="multiple"
    [placeholder]="placeholder"
  ></currency-field>

  <text-field
    [mask]="mask"
    [readOnly]="readOnly"
    [helperText]="helperText"
    [errorText]="errorText"
    [form]="inputForm"
    [id]="id"
    [testId]="testId"
    [label]="label"
    name="number"
    [state]="state"
  ></text-field>
</div>
