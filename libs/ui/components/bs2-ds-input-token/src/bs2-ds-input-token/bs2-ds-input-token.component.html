@let block = "bs2_ds_input_text";

<div
  class="
    {{ block }}
    {{ class }} {{ getErrors || errorText ? 'error' : '' }} {{ state }}
    {{ control.disabled ? 'disabled' : '' }}
  "
>
  @if(!hideErrors){
  <span class="{{ block }}__feedback">
    {{ errorText || getErrors }}
  </span>
  } @if(helperText){
  <span class="{{ block }}__helper">{{ helperText }}</span>
  }
  <div class="{{ block }}__wrapper" formArrayName="forms">
    @for(item of form.controls; track $index;){
    <input
      #bs2DSInputToken
      class="{{ block }}__field"
      type="text"
      maxlength="1"
      size="1"
      [readOnly]="readOnly"
      [formControl]="getControlByItem(item)"
      (input)="onInput($event, $index)"
      (keyup)="onKeyUp($event, $index)"
      (paste)="onPaste($event)"
    />
    }
  </div>
  <label [for]="id" class="{{ block }}__label">{{ label }}</label>
</div>
