@let block = "bs2_ds_stepper_item";

<div class="{{ block }}">
  <div class="{{ block }}__step" [class.default]="isDefault()" [class.done]="isDone()" [class.doing]="isDoing()"
    [class.error]="isError()">
    @if (isDefault() || isDoing()) {
    <span class="{{ block }}__step_value">{{ index() + 1 }}</span>
    }
    @if (isDone()) {
    <bs2-ds-icon class="{{ block }}__step_value" name="ico-checked" [color]="'var(--primary_text_bkg_light)'" aria-hidden="true" />
    }
    @if (isError()) {
    <bs2-ds-icon class="{{ block }}__step_value" name="ico-erro" [color]="'var(--primary_text_bkg_light)'" aria-hidden="true" />
    }
  </div>
  @if (label()) {
  <h5 class="{{ block }}__label">{{ label() }}</h5>
  }
  @if (title()) {
  <h4 class="{{ block }}__title">{{ title() }}</h4>
  }
  @if (description()) {
  <p class="{{ block }}__description">{{ description() }}</p>
  }
</div>
