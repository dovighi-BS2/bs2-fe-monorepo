@let block = 'bs2_ds_input_phone';

<div
  [id]="id"
  [attr.data-test]="testId"
  class="
    {{ block }}
    {{ getErrors || errorText ? 'error' : '' }} {{ state }}
    {{ control.disabled ? 'disabled' : '' }}
"
>
  @if(helperText){
  <div class="{{ block }}__helper">{{ helperText }}</div>
  } @if(errorText || getErrors){
  <div class="{{ block }}__feedback">{{ errorText || getErrors }}</div>
  }
  <div class="{{ block }}__wrapper">
    <div class="{{ block }}__left">
      <bs2-ds-input-select
        [state]="getErrors || errorText ? 'error' : undefined"
        [control]="codeControl"
        [options]="codes"
        [hideErrors]="true"
      />
    </div>
    <div class="{{ block }}__right">
      <bs2-ds-input-text
        [state]="getErrors || errorText ? 'error' : undefined"
        [control]="phoneControl"
        [mask]="masks[codeControl.value]"
        [hideErrors]="true"
      />
    </div>
  </div>
  <label class="{{ block }}__label">{{ label }}</label>
</div>
