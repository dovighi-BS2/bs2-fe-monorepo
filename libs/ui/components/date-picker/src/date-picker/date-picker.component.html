<div
  *ngIf="!!form"
  [attr.data-test]="testId"
  class="date_picker {{ class }} {{ getErrors || errorText ? 'error' : '' }} {{ state }}"
  [formGroup]="form"
  #datePickerRef
>
  <span class="date_picker__helper" *ngIf="!!helperText">{{ helperText }}</span>
  <span class="date_picker__feedback" *ngIf="!!getErrors || !!errorText">
    {{ getErrors }}
    {{ errorText }}
  </span>
  <div class="date_picker__wrapper">
    <div class="date_picker__icon left" *ngIf="leftIcon"></div>
    <div class="date_picker__icon right" *ngIf="rightIcon"></div>
    <input
      class="date_picker__field"
      [id]="id"
      [placeholder]="placeholder"
      [readOnly]="readOnly"
      [name]="name"
      [formControlName]="name"
      autocomplete="off"
      (click)="state = 'opened'; activePickerType = 'day'"
      (keyup)="handleInputChange()"
    />
    <div class="date_picker__calendar">
      <ng-container *ngTemplateOutlet="dayPickerCalendar"></ng-container>
      <ng-container *ngTemplateOutlet="monthPickerCalendar"></ng-container>
      <ng-container *ngTemplateOutlet="yearPickerCalendar"></ng-container>
    </div>
  </div>
  <label *ngIf="label" [for]="id" class="date_picker__label">{{ label }}</label>
</div>

<ng-template #dayPickerCalendar>
  <div class="date_picker__day_picker {{ activePickerType === 'day' ? 'active' : '' }}">
    <div class="date_picker__top">
      <div class="date_picker__top_left">
        <span class="date_picker__title" (click)="dayPicker.goToYearPicker()">
          {{ dayPicker.getSelectedMonthName()?.abbr }} {{ selectedYear }}
        </span>
      </div>
      <div class="date_picker__top_right">
        <span class="date_picker__previous" (click)="dayPicker.previousMonth()"> < </span>
        <span class="date_picker__next" (click)="dayPicker.nextMonth()">></span>
      </div>
    </div>
    <div class="date_picker__body">
      <div class="date_picker__weekday">
        <span class="date_picker__weekday_item sunday">D</span>
        <span class="date_picker__weekday_item">S</span>
        <span class="date_picker__weekday_item">T</span>
        <span class="date_picker__weekday_item">Q</span>
        <span class="date_picker__weekday_item">Q</span>
        <span class="date_picker__weekday_item">S</span>
        <span class="date_picker__weekday_item saturday">S</span>
      </div>
      <div class="date_picker__day">
        <span class="date_picker__day_item previous_month" *ngFor="let d of calendarPreviousMonth">{{
          d | date : 'dd'
        }}</span>
        <span
          class="
            date_picker__day_item current_month
            {{ dayPicker.isToday(d) ? 'current' : '' }}
            {{ dayPicker.canActiveDay(d) ? 'active' : '' }}
            {{ !isDaySelectable(d) ? 'disabled' : '' }}
          "
          *ngFor="let d of calendarMonth"
          (click)="dayPicker.selectDate(d, 'click')"
          >{{ d | date : 'dd' }}</span
        >
        <span class="date_picker__day_item next_month" *ngFor="let d of calendarNextMonth">{{ d | date : 'dd' }}</span>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #monthPickerCalendar>
  <div class="date_picker__month_picker  {{ activePickerType === 'month' ? 'active' : '' }}">
    <div class="date_picker__top">
      <div class="date_picker__top_left">
        <span class="date_picker__title" (click)="monthPicker.goToDayPicker()">
          {{ selectedYear }}
        </span>
      </div>
      <div class="date_picker__top_right">
        <span class="date_picker__previous" (click)="monthPicker.previousYear()"> < </span>
        <span class="date_picker__next" (click)="monthPicker.nextYear()">></span>
      </div>
    </div>
    <div class="date_picker__body">
      <div class="date_picker__month">
        <span
          class="date_picker__month_item
          {{ month.number === selectedMonth ? 'active' : '' }}
          {{ !isMonthSelectable(month.number) ? 'disabled' : '' }}
          "
          (click)="monthPicker.selectMonth(month.number)"
          *ngFor="let month of calendarMonths"
        >
          {{ month.abbr }}
        </span>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #yearPickerCalendar>
  <div class="date_picker__year_picker  {{ activePickerType === 'year' ? 'active' : '' }}">
    <div class="date_picker__top">
      <div class="date_picker__top_left">
        <span class="date_picker__title" (click)="yearPicker.goToDayPicker()">
          {{ yearPicker.getFirstAndLastYear() }}
        </span>
      </div>
      <div class="date_picker__top_right">
        <span class="date_picker__previous" (click)="yearPicker.previousYears()"> < </span>
        <span class="date_picker__next" (click)="yearPicker.nextYears()">></span>
      </div>
    </div>
    <div class="date_picker__body">
      <div class="date_picker__year">
        <span
          class="
            date_picker__year_item
            {{ year === selectedYear ? 'active' : '' }}
            {{ !isYearSelectable(year) ? 'disabled' : '' }}
            "
          *ngFor="let year of calendarYears"
          (click)="yearPicker.selectYear(year)"
        >
          {{ year }}
        </span>
      </div>
    </div>
  </div>
</ng-template>
