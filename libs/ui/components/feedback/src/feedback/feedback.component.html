<div class="feedback_item {{ status }} {{ type }} {{ class }}" [attr.data-test]="testId">
  <div class="feedback_item__left">
    <span class="feedback_item__icon"></span>
    <span class="feedback_item__message">{{ message }}</span>
  </div>
  <div class="feedback_item__right">
    <span class="feedback_item__close"></span>
  </div>
</div>
