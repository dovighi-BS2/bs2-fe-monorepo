@let block = "bs2_ds_input_text";

<div
  class="
    {{ block }}
    {{ class }} {{ getErrors || errorText ? 'error' : '' }} {{ state }}
    {{ control.disabled ? 'disabled' : '' }}
  "
>
  @if(!hideErrors){
  <span class="{{ block }}__feedback">
    {{ errorText || getErrors }}
  </span>
  }
  <span class="{{ block }}__helper" *ngIf="!!helperText">{{ helperText }}</span>
  <div class="{{ block }}__wrapper">
    <div class="{{ block }}__icon left {{ leftIcon }}" *ngIf="leftIcon"></div>
    <div class="{{ block }}__icon right {{ rightIcon }}" *ngIf="rightIcon"></div>
    @if(!currencyMask){
    <input
      class="{{ block }}__field"
      [id]="id"
      [type]="type"
      [placeholder]="placeholder"
      [readOnly]="readOnly"
      [mask]="mask"
      [autocomplete]="autocomplete"
      (click)="clickEmitter.emit()"
      (keyup)="keyupEmitter.emit()"
      (input)="onInput($event)"
      [formControl]="control"
      [attr.aria-label]="ariaLabel"
      [attr.aria-required]="ariaRequired"
      [attr.aria-invalid]="ariaInvalid"
    />
    } @if(currencyMask){
    <input
      class="{{ block }}__field"
      [id]="id"
      [type]="type"
      [placeholder]="placeholder"
      [readOnly]="readOnly"
      [currencyMask]="mask"
      [autocomplete]="autocomplete"
      (click)="clickEmitter.emit()"
      (keyup)="keyupEmitter.emit()"
      (input)="onInput($event)"
      [formControl]="control"
      [attr.aria-label]="ariaLabel"
      [attr.aria-required]="ariaRequired"
      [attr.aria-invalid]="ariaInvalid"
      [currencyMask]="currencyMask"
    />
    }
  </div>
  <label *ngIf="label" [for]="id" class="{{ block }}__label">{{ label }}</label>
</div>
