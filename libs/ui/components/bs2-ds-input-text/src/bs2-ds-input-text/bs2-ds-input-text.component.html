@let block = "bs2_ds_input_text";

<div
  class="
    {{ block }}
    {{ class }} {{ getErrors || errorText ? 'error' : '' }} {{ state }}
    {{ control.disabled ? 'disabled' : '' }}
  "
>
  @if(!hideErrors){
  <span class="{{ block }}__feedback">
    {{ errorText || getErrors }}
  </span>
  }
  <span class="{{ block }}__helper" *ngIf="!!helperText">{{ helperText }}</span>
  <div class="{{ block }}__wrapper">
    <div class="{{ block }}__icon left" *ngIf="leftIcon" (click)="leftIconClick.emit()">
      <bs2-ds-icon
        [name]="leftIcon"
        [size]="'var(--bs2_ds_input_text__icon_width)'"
        [color]="'var(--bs2_ds_input_text__icon_color)'"
        aria-hidden="true"
      />
    </div>
    <div class="{{ block }}__icon right" *ngIf="rightIcon" (click)="rightIconClick.emit()">
      <bs2-ds-icon
        [name]="rightIcon"
        [size]="'var(--bs2_ds_input_text__icon_width)'"
        [color]="'var(--bs2_ds_input_text__icon_color)'"
        aria-hidden="true"
      />
    </div>
    @if(!currencyMask){
    <input
      class="{{ block }}__field"
      [id]="id"
      [type]="type"
      [placeholder]="placeholder"
      [readOnly]="readOnly"
      [mask]="mask"
      [autocomplete]="autocomplete"
      [style.text-transform]="uppercase ? 'uppercase' : null"
      (click)="clickEmitter.emit()"
      (keyup)="keyupEmitter.emit()"
      [formControl]="control"
      [attr.aria-label]="ariaLabel"
      [attr.aria-required]="ariaRequired"
      [attr.aria-invalid]="ariaInvalid"
    />
    } @if(currencyMask){
    <input
      class="{{ block }}__field"
      [id]="id"
      [type]="type"
      [placeholder]="placeholder"
      [readOnly]="readOnly"
      [currencyMask]="mask"
      [autocomplete]="autocomplete"
      [style.text-transform]="uppercase ? 'uppercase' : null"
      (click)="clickEmitter.emit()"
      (keyup)="keyupEmitter.emit()"
      [formControl]="control"
      [attr.aria-label]="ariaLabel"
      [attr.aria-required]="ariaRequired"
      [attr.aria-invalid]="ariaInvalid"
      [currencyMask]="currencyMask"
    />
    }
  </div>
  <label *ngIf="label" [for]="id" class="{{ block }}__label">{{ label }}</label>
</div>
