@let block = "bs2_ds_datepicker";

<div
  *ngIf="!!control"
  #datePickerRef
  class="
    {{ block }}
    {{ direction }}
    {{ class }}
    {{ getErrors || errorText ? 'error' : '' }}
    {{ isOpened() ? 'opened' : '' }}
    {{ state }}
    {{ controlToUser.disabled ? 'disabled' : '' }}
    "
>
  <bs2-ds-input-text
    [control]="controlToUser"
    [id]="id"
    name="date"
    [state]="state"
    [label]="label"
    [leftIcon]="leftIcon"
    [rightIcon]="rightIcon"
    [helperText]="helperText"
    [errorText]="errorText || getErrors"
    [placeholder]="placeholder"
    [readOnly]="readOnly"
    [ariaLabel]="ariaLabel"
    [ariaRequired]="ariaRequired"
    [ariaInvalid]="ariaInvalid"
    autocomplete="off"
    mask="00/00/0000"
    (clickEmitter)="dayPicker.open()"
    [isDate]="isDate"
  />
  <input type="hidden" [formControl]="control" />
  <div class="{{ block }}__calendar">
    <ng-container *ngTemplateOutlet="dayPickerCalendar"></ng-container>
    <ng-container *ngTemplateOutlet="monthPickerCalendar"></ng-container>
    <ng-container *ngTemplateOutlet="yearPickerCalendar"></ng-container>
  </div>
</div>

<ng-template #dayPickerCalendar>
  <div class="{{ block }}__day_picker {{ activePickerType === 'day' ? 'active' : '' }}">
    <div class="{{ block }}__top">
      <div class="{{ block }}__top_left">
        <span class="{{ block }}__title" (click)="dayPicker.goToYearPicker()">
          {{ dayPicker.getSelectedMonthName()?.abbr }} {{ selectedYear }}
        </span>
      </div>
      <div class="{{ block }}__top_right">
        <span class="{{ block }}__previous icon icon-chevronvoltar" (click)="dayPicker.previousMonth()"></span>
        <span class="{{ block }}__next icon icon-chevronprosseguir" (click)="dayPicker.nextMonth()"></span>
      </div>
    </div>
    <div class="{{ block }}__body">
      <div class="{{ block }}__weekday">
        <span class="{{ block }}__weekday_item sunday">D</span>
        <span class="{{ block }}__weekday_item">S</span>
        <span class="{{ block }}__weekday_item">T</span>
        <span class="{{ block }}__weekday_item">Q</span>
        <span class="{{ block }}__weekday_item">Q</span>
        <span class="{{ block }}__weekday_item">S</span>
        <span class="{{ block }}__weekday_item saturday">S</span>
      </div>
      <div class="{{ block }}__day">
        <span class="{{ block }}__day_item previous_month" *ngFor="let d of calendarPreviousMonth">{{
          d | date : 'dd'
        }}</span>
        <span
          class="
            {{ block }}__day_item current_month
            {{ dayPicker.isToday(d) ? 'current' : '' }}
            {{ dayPicker.canActiveDay(d) ? 'active' : '' }}
            {{ !isDaySelectable(d) ? 'disabled' : '' }}
          "
          *ngFor="let d of calendarMonth"
          (click)="dayPicker.selectDate(d, 'click')"
          >{{ d | date : 'dd' }}</span
        >
        <span class="{{ block }}__day_item next_month" *ngFor="let d of calendarNextMonth">{{ d | date : 'dd' }}</span>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #monthPickerCalendar>
  <div class="{{ block }}__month_picker  {{ activePickerType === 'month' ? 'active' : '' }}">
    <div class="{{ block }}__top">
      <div class="{{ block }}__top_left">
        <span class="{{ block }}__title" (click)="monthPicker.goToDayPicker()">
          {{ selectedYear }}
        </span>
      </div>
      <div class="{{ block }}__top_right">
        <span class="{{ block }}__previous icon icon-chevronvoltar" (click)="monthPicker.previousYear()"></span>
        <span class="{{ block }}__next icon icon-chevronprosseguir" (click)="monthPicker.nextYear()"></span>
      </div>
    </div>
    <div class="{{ block }}__body">
      <div class="{{ block }}__month">
        <span
          class="{{ block }}__month_item
          {{ month.number === selectedMonth ? 'active' : '' }}
          {{ !isMonthSelectable(month.number) ? 'disabled' : '' }}
          "
          (click)="monthPicker.selectMonth(month.number)"
          *ngFor="let month of calendarMonths"
        >
          {{ month.abbr }}
        </span>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #yearPickerCalendar>
  <div class="{{ block }}__year_picker  {{ activePickerType === 'year' ? 'active' : '' }}">
    <div class="{{ block }}__top">
      <div class="{{ block }}__top_left">
        <span class="{{ block }}__title" (click)="yearPicker.goToDayPicker()">
          {{ yearPicker.getFirstAndLastYear() }}
        </span>
      </div>
      <div class="{{ block }}__top_right">
        <span class="{{ block }}__previous" (click)="yearPicker.previousYears()"> < </span>
        <span class="{{ block }}__next" (click)="yearPicker.nextYears()">></span>
      </div>
    </div>
    <div class="{{ block }}__body">
      <div class="{{ block }}__year">
        <span
          class="
            {{ block }}__year_item
            {{ year === selectedYear ? 'active' : '' }}
            {{ !isYearSelectable(year) ? 'disabled' : '' }}
            "
          *ngFor="let year of calendarYears"
          (click)="yearPicker.selectYear(year)"
        >
          {{ year }}
        </span>
      </div>
    </div>
  </div>
</ng-template>
