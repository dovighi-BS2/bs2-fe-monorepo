@if(!isRemoved){
<div class="feedback {{ status }}" [attr.data-test]="testId">
  <div class="feedback__left">
    <span class="feedback__icon"></span>
    <div class="feedback__text">
      <span class="feedback__title">{{ title }}</span>
      <span class="feedback__message">{{ message }}</span>
    </div>
  </div>
  <div class="feedback__right">
    <span class="feedback__close" (click)="close()"></span>
  </div>
</div>
}
