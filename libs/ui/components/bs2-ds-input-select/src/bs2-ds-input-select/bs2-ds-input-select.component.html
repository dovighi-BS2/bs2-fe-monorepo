@let block = "bs2_ds_input_select";

<div
  [attr.id]="id"
  #selectInput
  class="
    {{ block }}
    {{ class }}
    {{ state }}
    {{ readOnly ? 'disabled' : '' }}
    {{ control.disabled ? 'disabled' : '' }}
    {{ getErrors || errorText ? 'error' : '' }}
  "
>
  <select [multiple]="controlIsArray" class="{{ block }}__hidden_field" [formControl]="control">
    <option *ngFor="let option of options">{{ option.text }}</option>
  </select>
  @if(!hideErrors){
  <span class="{{ block }}__feedback">
    {{ errorText || getErrors }}
  </span>
  }
  <span class="{{ block }}__helper" *ngIf="!!helperText">{{ helperText }}</span>
  <div class="{{ block }}__wrapper">
    <div class="{{ block }}__icon left" *ngIf="leftIcon" (click)="selectInputOption.focus()">
      <bs2-ds-icon
        [name]="leftIcon"
        [size]="'var(--bs2_ds_input_select__icon_width)'"
        [color]="'var(--bs2_ds_input_select__icon_color)'"
        aria-hidden="true"
      />
    </div>
    <div class="{{ block }}__icon right" *ngIf="rightIcon" (click)="selectInputOption.focus()">
      <bs2-ds-icon
        [name]="rightIcon"
        [size]="'var(--bs2_ds_input_select__icon_width)'"
        [color]="'var(--bs2_ds_input_select__icon_color)'"
        aria-hidden="true"
      />
    </div>
    <div
      #selectInputField
      class="{{ block }}__field"
      [attr.aria-label]="ariaLabel"
      [attr.aria-required]="ariaRequired"
      [attr.aria-invalid]="ariaInvalid"
    >
      <span class="{{ block }}__selected">
        <img
          [src]="getSelectedImage()"
          *ngIf="getSelectedImage() && !controlIsArray"
          class="{{ block }}__selected_image"
        />
        <p>{{ getSelectedTexts() }}</p>
      </span>
    </div>
    <div class="{{ block }}__option" #selectInputOption [tabindex]="0" role="listbox" cdkListbox>
      <div
        *ngFor="let option of options"
        class="{{ block }}__option_item {{ isSelected(option) ? 'selected' : '' }}"
        role="option"
        [cdkOption]="option.value"
        (keyup.enter)="selectByEnter(option)"
        (click)="selectByClick(option)"
      >
        <span class="{{ block }}__option_checkbox" *ngIf="!hideCheckbox && controlIsArray"></span>
        <img [src]="option.image" *ngIf="option.image" class="{{ block }}__img_flag" />
        <p>{{ option.text }}</p>
      </div>
    </div>
  </div>
  <label *ngIf="label" [for]="id" class="{{ block }}__label">{{ label }}</label>
</div>
