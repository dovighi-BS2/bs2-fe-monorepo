<div
  *ngIf="!!control"
  [attr.id]="id"
  [attr.data-test]="testId"
  #selectInput
  class="
    bs2_ds_input_select
    {{ class }}
    {{ state }}
    {{ readOnly ? 'disabled' : '' }}
    {{ control.disabled ? 'disabled' : '' }}
    {{ getErrors || errorText ? 'error' : '' }}
  "
>
  <select [multiple]="controlIsArray" class="bs2_ds_input_select__hidden_field" [formControl]="control">
    <option *ngFor="let option of options">{{ option.text }}</option>
  </select>
  <span class="bs2_ds_input_select__helper" *ngIf="!!helperText">{{ helperText }}</span>
  <span class="bs2_ds_input_select__feedback" *ngIf="!!getErrors || !!errorText">
    {{ errorText || getErrors }}
  </span>
  <div class="bs2_ds_input_select__wrapper">
    <i class="bs2_ds_input_select__icon left {{ leftIcon }}" *ngIf="leftIcon"></i>
    <i class="bs2_ds_input_select__icon right {{ rightIcon }}" *ngIf="rightIcon"></i>
    <div
      #selectInputField
      class="bs2_ds_input_select__field"
      [attr.aria-label]="ariaLabel"
      [attr.aria-required]="ariaRequired"
      [attr.aria-invalid]="ariaInvalid"
    >
      <span class="bs2_ds_input_select__selected">
        <img
          [src]="getSelectedImage()"
          *ngIf="getSelectedImage() && !controlIsArray"
          class="bs2_ds_input_select__selected_image"
        />
        <p>{{ getSelectedTexts() }}</p>
      </span>
    </div>
    <div class="bs2_ds_input_select__option" #selectInputOption [tabindex]="0" role="listbox" cdkListbox>
      <div
        *ngFor="let option of options"
        class="bs2_ds_input_select__option_item {{ isSelected(option) ? 'selected' : '' }}"
        role="option"
        [cdkOption]="option.value"
        (keyup.enter)="selectByEnter(option)"
        (click)="selectByClick(option)"
      >
        <span class="bs2_ds_input_select__option_checkbox" *ngIf="!hideCheckbox && controlIsArray"></span>
        <img [src]="option.image" *ngIf="option.image" class="bs2_ds_input_select__img_flag" />
        <p>{{ option.text }}</p>
      </div>
    </div>
  </div>
  <label *ngIf="label" [for]="id" class="bs2_ds_input_select__label">{{ label }}</label>
</div>
