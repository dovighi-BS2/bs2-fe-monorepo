@let block = "bs2_ds_input_textarea";

<div
  class="
    {{ block }}
    {{ class }} {{ getErrors || errorText ? 'error' : '' }} {{ state }}
    {{ control.disabled ? 'disabled' : '' }}
  "
>
  <div class="{{ block }}__feedback_container">
    <span class="{{ block }}__feedback_wrapper">
      <span class="{{ block }}__helper" *ngIf="!!helperText">{{ helperText }}</span>
      @if(!hideErrors){
      <span class="{{ block }}__feedback">
        {{ errorText || getErrors }}
      </span>
      }
    </span>
    <span class="{{ block }}__feedback_max_length">
      @if(!!maxLength){
      {{ control.value?.length || 0 }} / {{ maxLength }}
      }
    </span>
  </div>
  <div class="{{ block }}__wrapper">
    <div class="{{ block }}__icon left {{ leftIcon }}" *ngIf="leftIcon"></div>
    <div class="{{ block }}__icon right {{ rightIcon }}" *ngIf="rightIcon"></div>
    <textarea
      class="{{ block }}__field {{ resize ? 'resize' : '' }} {{ autosize ? 'autosize' : '' }}"
      [rows]="rows"
      [cdkTextareaAutosize]="autosize"
      [id]="id"
      [placeholder]="placeholder"
      [readOnly]="readOnly"
      [autocomplete]="autocomplete"
      [formControl]="control"
      [attr.aria-label]="ariaLabel"
      [attr.aria-required]="ariaRequired"
      [attr.aria-invalid]="ariaInvalid"
    ></textarea>
  </div>
  <label *ngIf="label" [for]="id" class="{{ block }}__label">{{ label }}</label>
</div>
