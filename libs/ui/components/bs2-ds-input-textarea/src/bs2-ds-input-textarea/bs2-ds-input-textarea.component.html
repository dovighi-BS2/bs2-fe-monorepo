<div
  *ngIf="!!control"
  class="
    bs2_ds_input_textarea
    {{ class }} {{ getErrors || errorText ? 'error' : '' }} {{ state }}
    {{ control.disabled ? 'disabled' : '' }}
  "
>
  <div class="bs2_ds_input_textarea__feedback_container">
    <span class="bs2_ds_input_textarea__feedback_wrapper">
      <span class="bs2_ds_input_textarea__helper" *ngIf="!!helperText">{{ helperText }}</span>
      @if(!hideErrors){
      <span class="bs2_ds_input_textarea__feedback">
        {{ errorText || getErrors }}
      </span>
      }
    </span>
    <span class="bs2_ds_input_textarea__feedback_max_length">
      @if(!!maxLength){
      {{ control.value?.length || 0 }} / {{ maxLength }}
      }
    </span>
  </div>
  <div class="bs2_ds_input_textarea__wrapper">
    <div class="bs2_ds_input_textarea__icon left {{ leftIcon }}" *ngIf="leftIcon"></div>
    <div class="bs2_ds_input_textarea__icon right {{ rightIcon }}" *ngIf="rightIcon"></div>
    <textarea
      class="bs2_ds_input_textarea__field {{ resize ? 'resize' : '' }} {{ autosize ? 'autosize' : '' }}"
      [rows]="rows"
      [cdkTextareaAutosize]="autosize"
      [id]="id"
      [placeholder]="placeholder"
      [readOnly]="readOnly"
      [autocomplete]="autocomplete"
      [formControl]="control"
      [attr.aria-label]="ariaLabel"
      [attr.aria-required]="ariaRequired"
      [attr.aria-invalid]="ariaInvalid"
    ></textarea>
  </div>
  <label *ngIf="label" [for]="id" class="bs2_ds_input_textarea__label">{{ label }}</label>
</div>
