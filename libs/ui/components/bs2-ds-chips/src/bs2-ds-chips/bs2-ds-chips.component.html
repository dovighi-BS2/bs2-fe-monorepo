@let block = "bs2_ds_chips";

<ul class="{{ block }}">
  @for(item of _options; track item.value) {
  <li
    tabindex="1"
    class="
      {{ block }}__item
      {{ item.disabled ? 'disabled' : '' }}
      {{ isSelected(item) ? 'selected' : '' }}
    "
    (click)="select(item)"
    (keydown.enter)="select(item, $event)"
    (keydown.space)="select(item, $event)"
  >
    {{ item.label ?? item.value }}
  </li>
  }
</ul>
