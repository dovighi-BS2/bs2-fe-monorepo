@let block = "bs2_ds_input_currency";

<div [attr.id]="id" class="{{ block }}">
  <bs2-ds-input-select
    [readOnly]="readOnly"
    [helperText]="helperText"
    [errorText]="errorText"
    [control]="control"
    [options]="countries"
    [id]="id"
    [label]="label"
    [hideCheckbox]="true"
    [state]="state"
    [placeholder]="placeholder"
    [ariaLabel]="ariaLabel"
    [ariaRequired]="ariaRequired"
    [ariaInvalid]="ariaInvalid"
  ></bs2-ds-input-select>
</div>
