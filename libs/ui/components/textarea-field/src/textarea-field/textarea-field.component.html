<div
  *ngIf="!!form"
  [attr.data-test]="testId"
  class="textarea_input {{ class }} {{ getErrors || errorText ? 'error' : '' }} {{ state }}"
  [formGroup]="form"
>
  <div class="textarea_input__feedback_wrapper">
    <div class="textarea_input__feedback_left">
      <span class="textarea_input__helper" *ngIf="!!helperText">{{ helperText }}</span>
      <span class="textarea_input__feedback" *ngIf="!!getErrors || !!errorText">
        {{ getErrors }}
        {{ errorText }}
      </span>
    </div>
    <div class="textarea_input__feedback_right" *ngIf="!!maxLength">
      <span class="textarea_input__feedback_max_length">{{ control.value.length || 0 }} / {{ maxLength }}</span>
    </div>
  </div>
  <div class="textarea_input__wrapper">
    <div class="textarea_input__icon left" *ngIf="leftIcon"></div>
    <div class="textarea_input__icon right" *ngIf="rightIcon"></div>
    <textarea
      class="textarea_input__field {{ resize ? 'resize' : '' }} {{ autosize ? 'autosize' : '' }}"
      [rows]="rows"
      [cdkTextareaAutosize]="autosize"
      [id]="id"
      [placeholder]="placeholder"
      [readOnly]="readOnly"
      [name]="name"
      [autocomplete]="autocomplete"
      [formControlName]="name"
      [attr.aria-label]="ariaLabel"
      [attr.aria-required]="ariaRequired"
      [attr.aria-invalid]="ariaInvalid"
    ></textarea>
  </div>
  <label *ngIf="label" [for]="id" class="textarea_input__label">{{ label }}</label>
</div>
