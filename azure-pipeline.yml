trigger:
  branches:
    include:
      - develop
      - master
      - release/*
      - main

resources:
  repositories:
    - repository: templates
      type: git
      name: SRE/bs2.sre.pipelines
      ref: 'refs/heads/f/npmpublish'

variables:
  - group: 'InfraConfig-NOPRD'

stages:
  - template: templates/stages/pipeline-runNpm.yaml@templates
    parameters:
      azenvironment: 'default-noprd'
      command: npm i && npm run publish:npm-bs2-design-system
